<div class="selection-div">
    <p>2. SELECT COLOR</p>
    @for(color of colors; track color){
        <label class="options-radio">
            <input type="radio" id="color-radio"
            class="options-radio"
            [checked]="color === selectedColor"
            (change)="colorChanged.emit(color)"/>
            <span>{{color}}</span>
        </label>
    }
</div>
